# Dependency updates, proposed as pull requests rather than applied.
#
# This repository pins exact versions deliberately — `CLAUDE.md`'s stack table records what
# each pin costs and why several of them are load-bearing (`multiformats@14` because a `13.x`
# transitive dep produces CID instances that fail `instanceof` across package boundaries;
# `@multiformats/multiaddr@13.x` because v12 "will silently misbehave"). So updates arrive as
# a PR to be read, never as an automatic bump: a version that satisfies a range is not the
# same thing as a version this stack works with.
#
# CI gates every one of these PRs — the same six checks the branches require.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Enough to be useful, small enough that a stale queue does not become the reason nobody
    # reads them.
    open-pull-requests-limit: 5
    # Security advisories are what this is FOR. Version bumps for their own sake against a
    # deliberately-pinned stack are noise, and the pins above are the reason.
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies

    # ── The js-libp2p family moves as ONE pull request, and that is a measured rule ──────
    #
    # Without this block dependabot proposes each package on its own, and for THIS stack a
    # single-package bump of a monorepo member cannot pass CI. Measured 2026-08-31 against
    # PR #4 (`@libp2p/identify` 4.1.10 → 4.1.13), reproduced locally with a real install:
    #
    #   `@libp2p/identify@4.1.13` requires `@libp2p/interface@^3.3.0`. Two workspace
    #   manifests pin `@libp2p/interface` at exactly `3.2.5`, so npm must keep 3.2.5 at the
    #   hoist root and nests 3.3.0 beside every package that asks for it — five nested
    #   copies. TypeScript then compares two structurally different `Stream` types and
    #   emits 24 errors of the form *"Property 'readableEnded' is missing … but required
    #   in type … interface-internal/node_modules/@libp2p/interface"*.
    #
    # The errors name `identify`, so the obvious reading is a breaking change in its API.
    # It is not: the API is unchanged and the defect is a duplicated type vocabulary. That
    # misreading is exactly what this block exists to prevent a future agent from making.
    #
    # PR #5 (`@libp2p/webrtc`) failed the same way. PRs #3, #6 and #7 were GREEN and carried
    # the same split — typecheck simply did not reach it on their surface — so a passing
    # check is not evidence that a lone family bump is safe.
    #
    # Moved together the tree resolves to one copy of each: the family bump reached ZERO
    # duplicated members, down from the three `develop` already carried, and a
    # package-lock that got smaller rather than larger.
    #
    # ── AND IT WAS REVERTED THE SAME DAY. READ THIS BEFORE MERGING A GROUPED PR. ────────
    #
    # The grouped bump typechecks, and it breaks NET-08. An 8 MiB + 1 message arrived
    # TRUNCATED to 851 968 bytes and was delivered as a COMPLETE message with
    # `refusedInbound: 0` — a peer can make this node act on a fragment and believe it
    # received the whole. Measured on a quiet host, 15 of 15 on the old family against
    # 1 failed on the new, same source. See
    # `.planning/debug/2026-08-31-libp2p-bump-truncates-an-oversized-message.md`.
    #
    # **So the grouped pull request this block produces WILL ARRIVE GREEN, and green is
    # not enough to merge it.** `transport-bounds.node.test.ts` is one of the ~800 cases
    # `ci.yml` assigns to the developer machine — `O2_UNIT_ONLY=1` excludes it — so no CI
    # check on this repository can see the defect above. Before merging a js-libp2p
    # group, run `npm run test:node` in full on a quiet host and read
    # `transport-bounds.node.test.ts` specifically. That instruction is the whole reason
    # this paragraph outlives the revert.
    #
    # `@o2/libp2p` is this repository's own workspace package and is deliberately not
    # matched — the patterns name the published family, not the substring.
    groups:
      js-libp2p:
        patterns:
          - 'libp2p'
          - '@libp2p/*'
          - '@chainsafe/libp2p-*'
          - '@ipshipyard/libp2p-*'
          - '@multiformats/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
