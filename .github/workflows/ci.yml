# Tests on every push and pull request. Spends nothing.
#
# The lane split is not stylistic — it is measured, and CLAUDE.md § Measurement carries the
# reading. `node` and `aot` competed inside one project and a full sweep lost FIVE specs at
# once: two to a 900 000 ms hook budget, three to a harness child killed by a signal.
# Serialised they pass. The numbers say why they are separate jobs here:
#
#   node alone   161.70 s at (user+sys)/real 5.37   — CPU-bound
#   aot  alone  1181.61 s at              0.090     — waiting on a container
#   together    2872.08 s, and six load-sensitive node specs fall over
#
# So they run as separate jobs. On one runner that is also cheaper in wall clock.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the first. Nothing here deploys, so cancelling
# mid-run cannot leave anything half-applied.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  node:
    runs-on: ubuntu-latest
    # Long because the lane really is long: 161.70 s of test time measured locally, plus
    # install and the multi-process specs that spawn real agents.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:node

  # ─────────────────────────────────────────────────────────────────────────────────────
  # THE `aot` LANE IS NOT IN CI, AND THAT IS A FINDING RATHER THAN AN OMISSION.
  #
  # It was added on 2026-08-27, failed three runs, and each failure was about the host and
  # not about the code. Measured rather than guessed, in this order:
  #
  #   run 1, ubuntu-latest  `exec /bin/bash: exec format error` — the pinned elfconv image
  #                         is arm64 and the runner is x86. Moved to ubuntu-24.04-arm.
  #   run 2, ubuntu-24.04-arm  reading C absent, because it reads a wasm LLVM tree that
  #                         exists on the developer host. Fixed properly: the gate now
  #                         narrows on an absent reading, which its own docblock already
  #                         required. That fix is kept — it was a real defect.
  #   run 3, ubuntu-24.04-arm  three more, and this is where it stops being fixable:
  #                         - `elflift-wasm-determinism` wants /Volumes/ProjectsSSD/o2-wasi-llvm
  #                         - `elflift-wasi-gate` wants a second tree under Projects/hupyy
  #                         - `cross-machine` needs BOTH architectures in one run, because its
  #                           whole subject is the x86 image REFUSING an AArch64 input. On an
  #                           ARM runner the x86 image cannot exec; on x86 the arm64 one
  #                           cannot. No runner has both.
  #
  # Five of the eleven `tools/**` specs touch a host fact. Making them green on a runner
  # means weakening assertions written to measure a real toolchain — which CLAUDE.md § Proofs
  # forbids: "descoped is not satisfied; unmeasured is not met", and a criterion is not
  # rewritten to let something pass. A lane that is green because it stopped checking is
  # worse than a lane that is absent and says so.
  #
  # So the lane runs on the developer machine — `npm run test:aot`, 11/11, and CLAUDE.md
  # carries its measured numbers — and CI does not pretend to cover it.
  #
  # WHAT WOULD CHANGE THIS, so it is a decision rather than a dead end: publishing the two
  # LLVM trees as OCI artifacts, or a self-hosted arm64 runner with them mounted. Both are
  # real work and neither was in the scope of "run CI on push".
  # ─────────────────────────────────────────────────────────────────────────────────────

  bundle:
    # The hosted tier's bundle must still BUILD on every push. ARCHITECTURE §7: building is
    # not deploying. `--dry-run` needs no credential — measured, it exits 0 on a machine with
    # none configured — so this job holds no secret and cannot spend.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run --project node packages/node/src/hosted-tier-deploy.node.test.ts
        env:
          WRANGLER_SEND_METRICS: 'false'
