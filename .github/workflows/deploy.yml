# Deploys the hosted node. THIS IS THE ONE FILE IN THE REPOSITORY THAT SPENDS MONEY.
#
# ## Why the trigger is `release:` and not `on: push: tags:`
#
# Both fire on a tag. The difference is what a mistake looks like. `on: push: tags: ['v*']`
# becomes `on: push: branches: ['**']` in a two-word diff that reads as a widening rather
# than as a change of kind — and that shape is exactly the one DEMO-04 exists to refuse. A
# `release:` trigger cannot be widened into "every push" by editing a filter; the human act
# is structural. `disclosure-gate.node.test.ts` refuses `push:` on any money-spending
# workflow for this reason, and it refuses it even when `tags:` is present.
#
# ## Why this is allowed to exist at all
#
# DEMO-04 read "no `.github/` may exist", and that absence was a PROXY for the real claim:
# public deployment is an explicitly triggered act, never an automatic consequence. The proxy
# was replaced on 2026-08-27 by owner ruling, and the claim is now checked directly. Cost of
# getting it wrong, unchanged: Cloudflare has no hard spending ceiling — its own wording for
# budget alerts is "informational only. It does not cap your usage." The runaway-bill report
# this project cites was multiplied by 60+ preview deployments.
#
# `preview_urls: false` in `wrangler.jsonc` is the other half, and it has its own guard.
name: Deploy hosted node

on:
  release:
    types: [published]

# Serialised, and NEVER cancelled mid-run. A cancelled deploy can leave the account holding
# a half-applied version, which is the one failure mode worse than a slow queue.
concurrency:
  group: deploy-hosted
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The secret lives on the environment, not on the repository, so no other workflow in
    # this repository can read it even by accident. Add a required reviewer here to make the
    # deploy wait for a human click as well as a tag — that is a repository setting rather
    # than something this file can assert.
    environment: cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # ONE SCRIPT, not a second copy of the procedure. `scripts/deploy-hosted.sh` runs the
      # gate (typecheck, the unit set, the bundle build), refuses a name matching the
      # account's production prefix, deploys, and reads the identity back — failing if the
      # PeerId changed.
      #
      # **The drift this replaces was real and was found here.** These steps used to run
      # `npm run test:node` while `ci.yml` had already been corrected to the unit set after
      # three CI failures on host-sensitive specs. The same three specs, the same failure,
      # in the one workflow where failing costs the most — because two copies of a procedure
      # diverge and one copy cannot. The run that surfaced it is 33109850406.
      #
      # It runs identically on a laptop: `scripts/deploy-hosted.sh --live`.
      - run: scripts/deploy-hosted.sh --live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── The browser client ─────────────────────────────────────────────────────────────────
  #
  # `needs: deploy`, and the ordering is the whole point rather than tidiness: this job asks
  # the deployed node for its PeerId and writes it into the `bootstrap.json` every visitor
  # fetches. Run before the node deploy, it would publish the address of the build being
  # replaced.
  #
  # **The PeerId is the one value that cannot differ across that boundary** — it is persisted
  # in Durable Object storage and `deploy-hosted.sh` rolls a deploy back if it changes — so the
  # dependency buys ordering rather than correctness. It is declared anyway, because a reader
  # should not have to know that invariant to see why the order is right.
  #
  # ONE SCRIPT, the same as the node tier: `scripts/deploy-pages.sh --live` runs identically on
  # a laptop. Two copies of a procedure diverge; one cannot.
  publish-client:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Wider than the job above, and only here: publishing means committing a built site to the
    # `gh-pages` branch. The Cloudflare job keeps `contents: read` from the workflow default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          # The publish reads how far `gh-pages` was behind and writes it into the commit
          # message, which a shallow clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Publish the browser client
        run: scripts/deploy-pages.sh --live
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
